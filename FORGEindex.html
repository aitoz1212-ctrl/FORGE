<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FORGE Bench</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FORGE">
  <meta name="theme-color" content="#0b0b10">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png" type="image/png">
  <style>
    :root {
      --bg: #0b0b10; --bg2: #12121a; --card: #16161f; --card2: #1d1d28; --line: rgba(255,255,255,0.09);
      --text: #f4f6fa; --muted: #9aa3b2; --dim: #6b7280;
      --accent: #6366f1; --accent2: #818cf8; --accentSoft: rgba(99,102,241,0.16);
      --ok: #10b981; --okSoft: rgba(16,185,129,0.15); --warn: #f59e0b; --danger: #ef4444;
      --r: 16px; --nav: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    input, select, textarea { font: inherit; color: var(--text); }
    h1, h2, h3, p { margin: 0; }
    .wrap { max-width: 520px; margin: 0 auto; padding: calc(12px + var(--safe-t)) 16px calc(var(--nav) + 110px + var(--safe-b)); }
    .hidden { display: none !important; }

    /* header */
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .brand { font-weight: 800; letter-spacing: 0.06em; font-size: 20px; }
    .brand small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.12em; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--line); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* cards */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .big { font-size: 40px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
    .big small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 4px; }
    .muted { color: var(--muted); } .dim { color: var(--dim); } .small { font-size: 12px; } .tiny { font-size: 11px; }
    .row { display: flex; align-items: center; gap: 8px; } .row.between { justify-content: space-between; } .wrapf { flex-wrap: wrap; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
    .stat b { display: block; font-size: 20px; } .stat span { font-size: 11px; color: var(--muted); }
    .up { color: var(--ok); } .down { color: var(--danger); }
    .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--accentSoft); color: var(--accent2); }
    .pill.ok { background: var(--okSoft); color: #6ee7b7; } .pill.warn { background: rgba(245,158,11,0.15); color: #fcd34d; } .pill.gray { background: rgba(255,255,255,0.07); color: var(--muted); }
    .sep { height: 1px; background: var(--line); margin: 12px 0; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 700; background: var(--card2); border: 1px solid var(--line); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
    .btn.ghost { background: transparent; }
    .btn.danger { color: #fca5a5; }
    .btn.block { width: 100%; }
    .btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
    .btn:active { transform: scale(0.98); }
    .link { color: var(--accent2); font-weight: 700; font-size: 13px; }

    /* inputs */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .inp { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); outline: none; }
    .inp:focus { border-color: var(--accent); }
    select.inp { appearance: none; -webkit-appearance: none; }

    /* nav */
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(11,11,16,0.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
    .nav-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav); }
    .nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--dim); }
    .nav button svg { width: 22px; height: 22px; }
    .nav button.on { color: var(--accent2); }

    /* record: date bar */
    .datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .datebar .d { flex: 1; text-align: center; font-weight: 800; font-size: 17px; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; }
    .week button { padding: 6px 0; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    .week button b { display: block; font-size: 15px; color: var(--text); }
    .week button.sel { background: var(--accent); border-color: var(--accent); color: #e0e7ff; }
    .week button .dot { display: block; width: 5px; height: 5px; border-radius: 50%; margin: 2px auto 0; background: transparent; }
    .week button .dot.on { background: var(--ok); }

    /* exercise card */
    .ex { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
    .ex.bench { border-color: rgba(99,102,241,0.45); }
    .ex-head { padding: 12px 14px 8px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .ex-name { font-weight: 800; font-size: 16px; }
    .ex-plan { font-size: 12px; color: #6ee7b7; margin-top: 2px; }
    .ex-prev { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .sets { padding: 0 8px 8px; }
    .set { display: grid; grid-template-columns: 28px 1.35fr 1fr 44px 42px; gap: 6px; align-items: center; padding: 6px 4px; border-radius: 12px; }
    .set + .set { margin-top: 2px; }
    .set.done { background: var(--okSoft); }
    .set.wu .setno { color: var(--warn); }
    .setno { text-align: center; font-weight: 800; font-size: 13px; color: var(--muted); border-radius: 8px; padding: 6px 0; background: rgba(255,255,255,0.04); }
    .stepper { display: grid; grid-template-columns: 26px 1fr 26px; align-items: center; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; height: 42px; }
    .stepper button { height: 100%; font-size: 18px; font-weight: 700; color: var(--muted); }
    .stepper input { width: 100%; min-width: 0; text-align: center; background: transparent; border: 0; outline: none; font-weight: 800; font-size: 16px; padding: 0; }
    .stepper .u { font-size: 10px; color: var(--dim); text-align: center; line-height: 1; margin-top: -2px; }
    .rir { height: 42px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); text-align: center; font-weight: 700; font-size: 13px; padding: 0; width: 100%; appearance: none; -webkit-appearance: none; text-align-last: center; }
    .check { width: 42px; height: 42px; border-radius: 10px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; }
    .check svg { width: 22px; height: 22px; opacity: 0.25; }
    .set.done .check { background: var(--ok); border-color: var(--ok); } .set.done .check svg { opacity: 1; }
    .set-sub { grid-column: 2 / 6; font-size: 11px; color: var(--dim); margin-top: -2px; padding-left: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
    .set-head { display: grid; grid-template-columns: 28px 1.35fr 1fr 44px 42px; gap: 6px; padding: 0 4px 2px; font-size: 10px; color: var(--dim); text-align: center; font-weight: 700; }
    .ex-foot { display: flex; gap: 8px; padding: 4px 12px 12px; flex-wrap: wrap; }
    .cues { margin: 0 12px 10px; background: var(--bg2); border-radius: 12px; padding: 8px 10px; }
    .cues summary { font-size: 12px; font-weight: 700; color: var(--accent2); cursor: pointer; list-style: none; }
    .cues summary::-webkit-details-marker { display: none; }
    .cue { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 5px 0; }
    .cue input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ok); flex-shrink: 0; }

    /* timer */
    .timer { position: fixed; left: 0; right: 0; bottom: calc(var(--nav) + var(--safe-b) + 8px); z-index: 45; padding: 0 12px; }
    .timer-in { max-width: 496px; margin: 0 auto; background: #1f1f2e; border: 1px solid rgba(129,140,248,0.5); border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .timer-t { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 78px; }
    .timer.end .timer-in { border-color: var(--ok); background: #10261f; }
    .timer-bar { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .timer-bar i { display: block; height: 100%; background: var(--accent2); }

    /* sheet & dialog */
    .sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--bg2); border-top-left-radius: 22px; border-top-right-radius: 22px; border: 1px solid var(--line); padding: 16px 16px calc(24px + var(--safe-b)); }
    .sheet.full { height: 100vh; max-height: 100vh; border-radius: 0; padding-top: calc(16px + var(--safe-t)); }
    .sheet-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .sheet-h h3 { font-size: 18px; font-weight: 800; }
    .dlg-bg { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 24px; }
    .dlg { width: 100%; max-width: 340px; background: #17171f; border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
    .dlg p { white-space: pre-line; font-size: 14px; margin-bottom: 16px; }
    .toast { position: fixed; left: 50%; top: calc(18px + var(--safe-t)); transform: translateX(-50%); z-index: 100; background: var(--ok); color: #fff; font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); white-space: pre-line; text-align: center; max-width: 88vw; pointer-events: none; }
    .toast.err { background: var(--danger); }

    /* list items */
    .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 12px; background: var(--card2); margin-bottom: 8px; }
    .item-main { flex: 1; min-width: 0; }
    .item-title { font-weight: 700; }
    .item-sub { font-size: 12px; color: var(--muted); }
    .pick { width: 100%; text-align: left; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
    .tabs button { flex-shrink: 0; padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
    .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .group { border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px; background: var(--card); }
    .group.active { border-color: rgba(99,102,241,0.6); }
    .group-h { padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
    .group-b { padding: 0 10px 10px; }
    .sess { padding: 10px 12px; border-radius: 12px; background: var(--card2); margin-bottom: 6px; }
    .sess.next { outline: 2px solid var(--ok); }
    .empty { text-align: center; color: var(--muted); padding: 24px 12px; font-size: 14px; }
    table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.t th { color: var(--muted); font-weight: 600; text-align: left; padding: 6px 4px; font-size: 11px; border-bottom: 1px solid var(--line); }
    table.t td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
    table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .bar-row { display: grid; grid-template-columns: 44px 1fr 56px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 8px; }
    .bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,0.07); position: relative; overflow: hidden; }
    .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); }
    .bar .band { position: absolute; top: 0; bottom: 0; background: rgba(16,185,129,0.18); }
    .plates { display: flex; align-items: center; gap: 3px; min-height: 70px; justify-content: center; }
    .plates .barl { width: 40px; height: 8px; background: #9ca3af; border-radius: 2px; }
    .plates .pl { border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #111; writing-mode: vertical-rl; }
    svg.chart text { fill: var(--dim); font-size: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">FORGE<small>BENCH PRESS LAB</small></div>
      <div class="row">
      <button class="btn sm" id="openTimer" aria-label="休憩タイマー" style="min-height:40px;border-radius:12px;background:var(--accentSoft);border-color:rgba(129,140,248,0.4);color:#c7d2fe">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="12" cy="13" r="8"/><path stroke-linecap="round" d="M12 9v4l2.5 2M9 2h6"/></svg>タイマー</button>
      <button class="icon-btn" id="openSettings" aria-label="設定">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 002.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 001 2.5c1.8.5 1.8 3 0 3.5a1.7 1.7 0 00-1 2.5c.9 1.6-.9 3.3-2.4 2.4a1.7 1.7 0 00-2.6 1.1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 00-2.6-1.1c-1.5.9-3.3-.8-2.4-2.4a1.7 1.7 0 00-1-2.5c-1.8-.5-1.8-3 0-3.5a1.7 1.7 0 001-2.5c-.9-1.6.9-3.3 2.4-2.4a1.7 1.7 0 002.6-1.1z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      </div>
    </div>
    <main>
      <section id="view-home"></section>
      <section id="view-log" class="hidden"></section>
      <section id="view-prog" class="hidden"></section>
      <section id="view-stats" class="hidden"></section>
    </main>
  </div>

  <div id="timer" class="timer hidden">
    <div class="timer-in">
      <div style="flex:1;min-width:0;">
        <div class="row between"><span class="small muted" id="timerLabel">休憩</span><span class="tiny dim" id="timerNext"></span></div>
        <div class="row" style="gap:10px;"><span class="timer-t" id="timerT">0:00</span><div style="flex:1;"><div class="timer-bar"><i id="timerBar" style="width:0%"></i></div></div></div>
      </div>
      <button class="btn sm" id="timerPlus">+30秒</button>
      <button class="btn sm" id="timerSkip">終了</button>
    </div>
  </div>

  <nav class="nav">
    <div class="nav-in">
      <button data-view="home" class="on">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>ホーム</button>
      <button data-view="log">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 12h2m12 0h2M7 8v8m10-8v8M9 12h6M6 9v6m12-6v6"/></svg>記録</button>
      <button data-view="prog">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M4 11h16M5 5h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>プログラム</button>
      <button data-view="stats">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10m6 10V4m6 16v-7m4 7H3"/></svg>分析</button>
    </div>
  </nav>
  <input type="file" id="importFile" accept="application/json,.json,text/plain,.txt" class="hidden">
<script>
(function () {
'use strict';

// ===================== Utilities =====================
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dk = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseDk = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const fmtD = k => { const d = parseDk(k); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const today = () => dk(new Date());
const addDays = (k, n) => { const d = parseDk(k); d.setDate(d.getDate() + n); return dk(d); };
const daysBetween = (a, b) => Math.round((parseDk(b) - parseDk(a)) / 86400000);
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtKg = w => w == null ? '-' : (Math.round(w * 100) / 100).toString();
const roundTo = (w, step) => Math.round(w / step) * step;
// 推定1RM（Epley）。RIRがあれば「あと何回できたか」も加味
function e1rm(w, reps, rir) {
  if (!w || !reps) return null;
  const r = reps + (rir != null ? rir : 0);
  if (r > 12) return null;
  if (r <= 1) return w;
  return w * (1 + r / 30);
}
function mondayOf(k) { const d = parseDk(k); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return dk(d); }

// ===================== Storage（元アプリと同じキー＝記録を引き継ぐ） =====================
const KEY_DATA = 'workout-memo-data-v3';
const KEY_TPL = 'workout-memo-templates-v1';
const KEY_SEQ = 'workout-memo-template-seq-v1';
const KEY_WEIGHT = 'workout-memo-weight-v1';
const KEY_BIG3 = 'workout-memo-big3-v1';
const KEY_SET = 'forge-bench-settings-v1';
const KEY_REST = 'forge-bench-rest-v1';
const load = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('保存に失敗しました（容量不足の可能性）', true); } };

const DEFAULT_SETTINGS = { oneRM: null, meetDate: '', bar: 20, step: 2.5, restMain: 180, restAcc: 90, customEx: [], activeGroup: '', bgSound: true, notifyAsked: false, lastTimer: 120 };
function getSettings() {
  const s = Object.assign({}, DEFAULT_SETTINGS, load(KEY_SET, {}));
  if (!s.oneRM) { const b = load(KEY_BIG3, {}); if (b && b.bench) s.oneRM = Number(b.bench) || null; }
  return s;
}
function setSettings(patch) {
  const s = Object.assign(getSettings(), patch);
  save(KEY_SET, s);
  if (patch.oneRM) { const b = load(KEY_BIG3, {}); b.bench = patch.oneRM; save(KEY_BIG3, b); }
  return s;
}

function normSet(s) {
  const w = num(s.weight), r = num(s.reps);
  return {
    weight: w, reps: r == null ? null : Math.round(r),
    rir: s.rir == null || s.rir === '' ? null : Number(s.rir),
    warmup: !!s.warmup,
    done: s.done !== undefined ? !!s.done : (w != null && r != null)
  };
}

let restTick = null, audioCtx = null, restAudio = null, restAudioUrl = null, pageTimeout = null;

function buildRestWav(sec) {
  const rate = 8000, beepLen = 1.6, total = Math.round((sec + beepLen) * rate);
  const buf = new ArrayBuffer(44 + total), v = new DataView(buf);
  const wr = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  wr(0, 'RIFF'); v.setUint32(4, 36 + total, true); wr(8, 'WAVE'); wr(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); wr(36, 'data'); v.setUint32(40, total, true);
  const start = Math.round(sec * rate);
  for (let i = 0; i < total; i++) {
    let s = 128;
    if (i >= start) {
      const t = (i - start) / rate, ph = t % 0.4;
      if (ph < 0.25) s = 128 + Math.round(90 * Math.sin(2 * Math.PI * 880 * t));
    }

}

  const el = $('#timer');

  };
  const left0 = st.end - Date.now();

// ===================== セッション（テンプレ）とプログラム =====================
const DEFAULT_GROUP = 'マイセッション';
function getTemplates() {
  const t = load(KEY_TPL, []);
  if (!Array.isArray(t)) return [];
  return t.map((x, i) => Object.assign({}, x, { order: typeof x.order === 'number' ? x.order : i })).sort((a, b) => a.order - b.order);
}
function saveTemplates(list) { list.forEach((x, i) => { x.order = i; }); save(KEY_TPL, list); }
const groupOf = t => (t && t.group && String(t.group).trim()) || DEFAULT_GROUP;
function groupNames(list) { const out = []; (list || getTemplates()).forEach(t => { const g = groupOf(t); if (!out.includes(g)) out.push(g); }); return out; }
function uniqueGroup(base) { const n = groupNames(); if (!n.includes(base)) return base; let i = 2; while (n.includes(`${base} (${i})`)) i++; return `${base} (${i})`; }
function nextSession() {
  const all = getTemplates();
  if (!all.length) return null;
  const seq = load(KEY_SEQ, {});
  const last = all.find(t => t.id === seq.lastId);
  if (last) { const g = all.filter(t => groupOf(t) === groupOf(last)); return g[(g.findIndex(t => t.id === last.id) + 1) % g.length]; }
  const ag = getSettings().activeGroup;
  return all.find(t => groupOf(t) === ag) || all[0];
}
const kgFor = (r, oneRM) => r.kg != null ? r.kg : (r.pct && oneRM ? roundTo(oneRM * r.pct, getSettings().step || 2.5) : null);
function rxText(rx, oneRM) {
  return (rx || []).map(r => { const kg = kgFor(r, oneRM); return `${r.pct ? Math.round(r.pct * 100) + '% ' : ''}${kg != null ? kg + 'kg ' : ''}${r.reps}回×${r.sets}セット`; }).join(' → ');
}
function exPlanText(e, oneRM) {
  if (e.rx && e.rx.length) return rxText(e.rx, oneRM);
  if (e.setCount) return [e.targetWeight ? e.targetWeight + 'kg' : '', e.targetReps ? e.targetReps + '回' : '', e.setCount + 'セット'].filter(Boolean).join('×');
  return e.plan || '';
}
function parsePlanSets(plan) {
  const p = String(plan || '');
  let m = p.match(/(\d+)\s*[×x]\s*(\d+)/); // 3×8-12 → 3セット 8回
  if (m && !/回/.test(p)) return { sets: +m[1], reps: +m[2] };
  m = p.match(/(\d+)(?:-\d+)?回\s*[×x]\s*(\d+)セット/);
  if (m) return { sets: +m[2], reps: +m[1] };
  return null;
}
async function loadTemplateInto(t, k) {
  const s = getSettings();
  const needs1RM = (t.exercises || []).some(e => (e.rx || []).some(r => r.pct && r.kg == null));
  if (needs1RM && !s.oneRM) {
    await dialog('このセッションは1RMの％で重量を計算します。\n先にプログラム画面でベンチの1RMを入れてください。');
    show('prog'); return;
  }
  const day = getDay(k);
  let added = 0;
  (t.exercises || []).forEach(e => {
    if (day.exercises.some(x => x.name === e.name)) return;
    const sets = [];
    if (e.rx && e.rx.length) {
      const top = Math.max(...e.rx.map(r => kgFor(r, s.oneRM) || 0));
      if (isBench(e.name) && e.warmup !== false && top >= 50) {
        const bar = s.bar || 20;
        [[bar, 10], [top * 0.5, 5], [top * 0.7, 3], [top * 0.85, 1]].forEach(([w, r]) => {
          const kg = Math.max(bar, roundTo(w, s.step || 2.5));
          if (kg < top && !sets.some(x => x.weight === kg)) sets.push({ weight: kg, reps: r, rir: null, warmup: true, done: false });
        });
      }
      const prevW = workSets((lastSession(e.name, k) || { ex: { sets: [] } }).ex);
      let pi = 0;
      e.rx.forEach(r => { for (let n = 0; n < r.sets; n++) { const kg = kgFor(r, s.oneRM); sets.push({ weight: kg != null ? kg : (prevW[pi] || prevW[prevW.length - 1] || {}).weight || null, reps: r.reps, rir: null, warmup: false, done: false }); pi++; } });
    } else if (e.setCount) {
      for (let n = 0; n < e.setCount; n++) sets.push({ weight: num(e.targetWeight), reps: num(e.targetReps), rir: null, warmup: false, done: false });
    } else {
      const ps = parsePlanSets(e.plan);
      const prev = lastSession(e.name, k);
      const pw = prev ? workSets(prev.ex) : [];
      const n = ps ? ps.sets : (pw.length || 3);
      for (let x = 0; x < n; x++) sets.push({ weight: pw[x] ? pw[x].weight : (pw[0] ? pw[0].weight : null), reps: ps ? ps.reps : (pw[x] ? pw[x].reps : null), rir: null, warmup: false, done: false });
    }
    day.exercises.push({ name: e.name, bodyPart: partOf(e.name), note: '', plan: exPlanText(e, s.oneRM), sets });
    added++;
  });
  day.templateName = t.name;
  setDay(k, day);
  save(KEY_SEQ, { lastId: t.id, lastName: t.name, lastDate: k });
  setSettings({ activeGroup: groupOf(t) });
  logDate = k;
  show('log');
  toast(`「${t.name}」を読み込みました` + (added ? '' : '\n（種目はすでに入っています）'));
}
function openTemplatePicker() {
  const list = getTemplates();

  if (!list.length) { openSheet('プログラムから選ぶ', `<div class="empty">まだプログラムがありません。<br><br><button class="btn primary" data-go-prog>プログラムを作る</button></div>`).addEventListener('click', e => { if (e.target.closest('[data-go-prog]')) show('prog'); }); return; }
  const body = openSheet('プログラムから選ぶ', groupNames(list).map(g => `<div class="card-title" style="margin-top:6px">${esc(g)}</div>` + list.filter(t => groupOf(t) === g).map(t => `<button class="pick" data-tid="${esc(t.id)}"><span style="min-width:0"><b>${esc(t.name)}</b> ${nx && nx.id === t.id ? '<span class="pill ok">次</span>' : ''}<br><span class="small muted">${esc((t.exercises || []).map(e => e.name).join('・'))}</span></span><span class="link">読込</span></button>`).join('')).join(''), { full: true });
  body.addEventListener('click', e => { const b = e.target.closest('[data-tid]'); if (!b) return; const t = getTemplates().find(x => x.id === b.dataset.tid); if (t) loadTemplateInto(t, logDate); });
}
async function saveDayAsTemplate() {
  const day = getDay(logDate);
  if (!day.exercises.length) return;
  const exercises = day.exercises.map(ex => {
    const ws = ex.sets.filter(s => !s.warmup && s.weight && s.reps);
    if (!ws.length) return { name: ex.name, plan: ex.plan || '' };
    const rx = [];
    ws.forEach(s => { const last = rx[rx.length - 1]; if (last && last.kg === s.weight && last.reps === s.reps) last.sets++; else rx.push({ kg: s.weight, reps: s.reps, sets: 1 }); });
    return { name: ex.name, rx };
  });
  const name = (day.templateName ? day.templateName + ' ' : '') + fmtD(logDate) + 'のメニュー';
  const list = getTemplates();
  list.push({ id: 'tpl_' + Date.now(), name, group: DEFAULT_GROUP, exercises });

const SPLIT_PARTS = ['胸', '背中', '肩', '三頭', '二頭', '脚', '腹筋'];
const splitPartOf = name => { const p = partOf(name); return p === 'ベンチ' ? '胸' : p; };
function filterSessions(sessions, excluded) {
  if (!excluded || !excluded.length) return sessions;
  return sessions.map(sess => {
    const kept = sess.exercises.filter(e => !excluded.includes(splitPartOf(e.name)));
    const removed = [...new Set(sess.exercises.filter(e => excluded.includes(splitPartOf(e.name))).map(e => splitPartOf(e.name)))];
    return { name: sess.name + (removed.length && kept.length ? `（${removed.join('・')}なし）` : ''), exercises: kept };
  }).filter(sess => sess.exercises.length);
}

// ===================== 分析 =====================
function benchPoints() {
  // 日ごとの最高推定1RM（ベンチプレス・止めベンチ）
  const map = {};
  allEntries().forEach(({ k, ex }) => { if (!isCompBench(ex.name)) return; const v = bestE1rm(ex); if (v && (!map[k] || v > map[k])) map[k] = v; });
  return Object.keys(map).sort().map(k => ({ k, v: map[k] }));
}
function recentE1rm(days, endK) {
  const end = endK || today(); const start = addDays(end, -days);
  let best = null;
  benchPoints().forEach(p => { if (p.k > start && p.k <= end && (!best || p.v > best)) best = p.v; });
  return best;
}
function weekStats(monK) {
  const end = addDays(monK, 7);
  const out = { sessions: new Set(), benchSets: 0, tonnage: 0, muscles: { 胸: 0, 背中: 0, 肩: 0, 三頭: 0, 二頭: 0, 脚: 0, 腹筋: 0 } };
  allEntries().forEach(({ k, ex }) => {
    if (k < monK || k >= end) return;
    const ws = workSets(ex);
    if (!ws.length) return;
    out.sessions.add(k);
    if (isBench(ex.name)) { out.benchSets += ws.length; ws.forEach(s => { out.tonnage += s.weight * s.reps; }); }
    musclesOf(ex.name).forEach(m => { if (m in out.muscles) out.muscles[m] += ws.length; });
  });
  return out;
}
let chartRange = 180;
function lineChart(points, opts) {
  if (points.length < 2) return '<div class="empty">記録が2日分たまるとグラフが出ます</div>';
  const W = 340, H = 170, L = 34, R = 8, T = 10, B = 22;
  const t0 = parseDk(points[0].k).getTime(), t1 = parseDk(points[points.length - 1].k).getTime();
  const vs = points.map(p => p.v).concat(opts.ref ? [opts.ref] : []);
  let mn = Math.min(...vs), mx = Math.max(...vs); const pad = Math.max(2, (mx - mn) * 0.15); mn = Math.floor((mn - pad) / 5) * 5; mx = Math.ceil((mx + pad) / 5) * 5;
  const x = k => L + (t1 === t0 ? 0.5 : (parseDk(k).getTime() - t0) / (t1 - t0)) * (W - L - R);
  const y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,0.06)"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`; }
  const pts = points.map(p => `${x(p.k).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const ref = opts.ref ? `<line x1="${L}" x2="${W - R}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="#f59e0b" stroke-dasharray="4 4"/><text x="${W - R}" y="${y(opts.ref) - 4}" text-anchor="end" style="fill:#fcd34d">設定1RM ${opts.ref}</text>` : '';
  const lbl = [points[0], points[points.length - 1]].map((p, i) => `<text x="${x(p.k)}" y="${H - 6}" text-anchor="${i ? 'end' : 'start'}">${fmtD(p.k)}</text>`).join('');
  const dots = points.map(p => `<circle cx="${x(p.k).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.6" fill="#818cf8"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}${ref}<polyline points="${pts}" fill="none" stroke="#818cf8" stroke-width="2.2" stroke-linejoin="round"/>${dots}${lbl}</svg>`;
}
let prEx = 'ベンチプレス';
function renderStats() {
  const s = getSettings();
  const all = benchPoints();
  const from = chartRange ? addDays(today(), -chartRange) : '0000';
  const pts = all.filter(p => p.k >= from);
  const benchNames = [...new Set(allEntries().filter(x => isBench(x.ex.name) && workSets(x.ex).length).map(x => x.ex.name))];
  if (!benchNames.includes(prEx) && benchNames.length) prEx = benchNames[0];
  // PR表
  const prs = {};
  [1, 2, 3, 5, 8, 10].forEach(n => { prs[n] = null; });
  allEntries().forEach(({ k, ex }) => { if (ex.name !== prEx) return; workSets(ex).forEach(st => { Object.keys(prs).forEach(n => { if (st.reps >= +n && (!prs[n] || st.weight > prs[n].w)) prs[n] = { w: st.weight, k, reps: st.reps }; }); }); });
  // 週ごと
  const weeks = []; let mon = mondayOf(today());
  for (let i = 0; i < 8; i++) { weeks.unshift({ mon, st: weekStats(mon) }); mon = addDays(mon, -7); }
  const maxSets = Math.max(10, ...weeks.map(w => w.st.benchSets));
  const tw = weeks[weeks.length - 1].st;
  // 体重
  const wlog = load(KEY_WEIGHT, []).filter(x => x && x.date && x.weight).sort((a, b) => a.date.localeCompare(b.date));
  const bw = wlog.length ? wlog[wlog.length - 1].weight : null;
  const bestNow = recentE1rm(56) || s.oneRM;
  let h = `<div class="card"><div class="card-title">ベンチ 推定1RMの推移 <span class="tiny dim">ベンチ・止めベンチの本番セット</span></div>
    <div class="tabs">${[[90, '3ヶ月'], [180, '6ヶ月'], [365, '1年'], [0, '全期間']].map(([d, l]) => `<button data-range="${d}" class="${chartRange === d ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${lineChart(pts, { ref: s.oneRM })}</div>`;
  h += `<div class="card"><div class="card-title">自己ベスト（回数別）<select class="inp" id="prSel" style="width:auto;min-height:32px;font-size:12px">${(benchNames.length ? benchNames : ['ベンチプレス']).map(n => `<option ${n === prEx ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
    <table class="t"><tr><th>回数</th><th class="num">重量</th><th class="num">推定1RM</th><th class="num">日付</th></tr>${Object.entries(prs).map(([n, p]) => `<tr><td>${n}回</td><td class="num"><b>${p ? fmtKg(p.w) + 'kg' : '-'}</b></td><td class="num muted">${p ? fmtKg(Math.round(e1rm(p.w, p.reps))) : ''}</td><td class="num muted">${p ? fmtD(p.k) : ''}</td></tr>`).join('')}</table></div>`;
  h += `<div class="card"><div class="card-title">ベンチ系の週セット数（直近8週）<span class="tiny dim">アップ除く</span></div>
    ${weeks.map(w => `<div class="bar-row"><span class="muted">${fmtD(w.mon).replace(/\(.\)/, '')}〜</span><div class="bar"><i style="width:${w.st.benchSets / maxSets * 100}%"></i></div><span class="num" style="text-align:right">${w.st.benchSets}セット</span></div>`).join('')}
    <div class="tiny dim">今週のベンチ総挙上量 ${Math.round(tw.tonnage).toLocaleString()}kg ・ トレーニング ${tw.sessions.size}日</div></div>`;
  h += `<div class="card"><div class="card-title">今週の部位別セット数 <span class="tiny dim">緑の帯＝週10〜20セットの目安</span></div>
    ${Object.entries(tw.muscles).map(([m, n]) => `<div class="bar-row"><span>${m}</span><div class="bar"><span class="band" style="left:${10 / 25 * 100}%;width:${10 / 25 * 100}%"></span><i style="width:${Math.min(n, 25) / 25 * 100}%;background:${n < 10 ? '#f59e0b' : n > 20 ? '#ef4444' : '#10b981'}"></i></div><span style="text-align:right">${n}セット</span></div>`).join('')}
    <div class="tiny dim">ベンチ系・ディップスは胸と三頭の両方に数えています。</div></div>`;
  h += `<div class="card"><div class="card-title">体重と体重比</div>
    <div class="grid3"><div class="stat"><span>体重</span><b>${bw ? fmtKg(bw) : '-'}</b></div><div class="stat"><span>1RM</span><b>${bestNow ? fmtKg(roundTo(bestNow, 0.5)) : '-'}</b></div><div class="stat"><span>体重比</span><b>${bw && bestNow ? (bestNow / bw).toFixed(2) + '倍' : '-'}</b></div></div>
    <div class="row" style="margin-top:10px"><input class="inp" id="bwInp" inputmode="decimal" placeholder="今日の体重 kg" style="flex:1"><button class="btn primary" id="bwSave">記録</button></div>
    ${wlog.length >= 2 ? `<div style="margin-top:10px">${lineChart(wlog.slice(-60).map(x => ({ k: x.date, v: Number(x.weight) })), {})}</div>` : ''}</div>`;
  const names = [...new Set(allEntries().map(x => x.ex.name))];
  h += `<div class="card"><div class="card-title">種目の履歴</div><div class="row"><select class="inp" id="histSel">${names.map(n => `<option>${esc(n)}</option>`).join('')}</select><button class="btn" id="histGo">見る</button></div></div>`;
  $('#view-stats').innerHTML = h;
}
$('#view-stats').addEventListener('click', e => {
  const r = e.target.closest('[data-range]'); if (r) { chartRange = Number(r.dataset.range); return renderStats(); }
  if (e.target.closest('#bwSave')) {
    const w = num($('#bwInp').value); if (!w || w < 25 || w > 250) { toast('体重を正しく入れてください', true); return; }
    const log = load(KEY_WEIGHT, []).filter(x => x.date !== today()); log.push({ date: today(), weight: w }); save(KEY_WEIGHT, log); renderStats(); toast('保存しました'); return;
  }
  if (e.target.closest('#histGo')) { const n = $('#histSel').value; if (n) openHistory(n); }
});
$('#view-stats').addEventListener('change', e => { if (e.target.id === 'prSel') { prEx = e.target.value; renderStats(); } });

// ===================== ホーム =====================
function renderHome() {
  const s = getSettings();
  const est = recentE1rm(56);
  const prevEst = recentE1rm(28, addDays(today(), -28));
  const nx = nextSession();
  const tw = weekStats(mondayOf(today()));
  const pts = benchPoints().slice(-5).reverse();
  let h = `<div class="card"><div class="card-title">ベンチプレス ${s.meetDate ? (() => { const l = daysBetween(today(), s.meetDate); return l >= 0 ? `<span class="pill warn">大会まで${l}日</span>` : ''; })() : ''}</div>
    <div class="grid2"><div><div class="tiny muted">設定1RM</div><div class="big">${s.oneRM ? fmtKg(s.oneRM) : '—'}<small>kg</small></div></div>
    <div><div class="tiny muted">推定1RM（直近8週）</div><div class="big" style="color:var(--accent2)">${est ? fmtKg(roundTo(est, 0.5)) : '—'}<small>kg</small></div>
    ${est && prevEst ? `<div class="small ${est >= prevEst ? 'up' : 'down'}">${est >= prevEst ? '▲' : '▼'} ${fmtKg(Math.abs(Math.round((est - prevEst) * 10) / 10))}kg（4週前比）</div>` : ''}</div></div>
    ${!s.oneRM ? '<button class="btn primary block" data-go="prog" style="margin-top:12px">1RMを設定する</button>' : ''}
    ${est && s.oneRM && est > s.oneRM + 1 ? `<button class="btn block" data-apply-est="${roundTo(est, s.step || 2.5)}" style="margin-top:10px">推定が設定を上回っています → 1RMを${roundTo(est, s.step || 2.5)}kgに更新</button>` : ''}
  </div>`;
  if (nx) {
    h += `<div class="card"><div class="card-title">次のセッション <span class="tiny dim">${esc(groupOf(nx))}</span></div>
      <div style="font-weight:800;font-size:18px;margin-bottom:6px">${esc(nx.name)}</div>
      ${(nx.exercises || []).map(e => `<div class="small"><span>${esc(e.name)}</span> <span class="muted">${esc(exPlanText(e, s.oneRM))}</span></div>`).join('')}
      <button class="btn primary block" data-start style="margin-top:12px">今日やる（記録に読み込む）</button></div>`;
  } else {
    h += `<div class="card"><div class="card-title">はじめに</div><p class="small muted" style="margin-bottom:10px">1RMを入れてプログラムを作ると、毎回の重量・セット数が自動で入ります。</p><button class="btn primary block" data-go="prog">プログラムを作る</button></div>`;
  }
  h += `<div class="card"><div class="card-title">今週</div><div class="grid3">
    <div class="stat"><span>トレ日数</span><b>${tw.sessions.size}</b></div><div class="stat"><span>ベンチ系セット</span><b>${tw.benchSets}</b></div><div class="stat"><span>胸のセット</span><b class="${tw.muscles['胸'] < 10 ? '' : tw.muscles['胸'] > 20 ? 'down' : 'up'}">${tw.muscles['胸']}</b></div></div>
    <div class="tiny dim" style="margin-top:6px">胸は週10〜20セットが目安</div></div>`;
  h += `<div class="card"><div class="card-title">最近のベンチ <button class="link" data-go="stats">分析へ</button></div>
    ${pts.length ? pts.map(p => `<div class="row between small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${fmtD(p.k)}</span><span class="muted">推定1RM <b style="color:var(--text)">${fmtKg(Math.round(p.v * 10) / 10)}kg</b></span></div>`).join('') : '<div class="small muted">まだベンチの記録がありません</div>'}
    <button class="btn block" data-go="log" style="margin-top:12px">記録をつける</button></div>`;
  const lb = getSettings().lastBackup;
  const hasData = Object.keys(allData()).length > 0;
  if (hasData && (!lb || Date.now() - lb > 7 * 86400000)) {
    h = `<div class="card" style="border-color:rgba(245,158,11,0.5)"><div class="row between"><div><div class="small" style="color:#fcd34d;font-weight:700">バックアップ ${lb ? Math.floor((Date.now() - lb) / 86400000) + '日前' : '未実施'}</div><div class="tiny muted">機種変更やデータ削除に備えて保存しましょう</div></div><button class="btn sm primary" data-backup-now>保存</button></div></div>` + h;
  }
  $('#view-home').innerHTML = h;
}
$('#view-home').addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { if (go.dataset.go === 'log') logDate = today(); return show(go.dataset.go); }
  if (e.target.closest('[data-start]')) { const nx = nextSession(); if (nx) loadTemplateInto(nx, today()); return; }
  if (e.target.closest('[data-backup-now]')) { shareBackup().then(() => renderHome()); return; }
  const ap = e.target.closest('[data-apply-est]'); if (ap) { setSettings({ oneRM: Number(ap.dataset.applyEst) }); renderHome(); toast('1RMを更新しました'); }
});

// ===================== 設定・バックアップ =====================
const BACKUP_KEYS = [KEY_DATA, KEY_TPL, KEY_SEQ, KEY_WEIGHT, KEY_BIG3, KEY_SET];
function openSettings() {
  const s = getSettings();
  const days = Object.keys(allData()).length;
  const body = openSheet('設定', `
    <div class="grid2">
      <div class="field"><label>バーの重さ（kg）</label><input class="inp" id="stBar" inputmode="decimal" value="${s.bar}"></div>
      <div class="field"><label>重量の刻み（kg）</label><select class="inp" id="stStep">${[1, 1.25, 2.5, 5].map(v => `<option ${s.step === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>休憩：ベンチ系（秒）</label><input class="inp" id="stRestM" inputmode="numeric" value="${s.restMain}"></div>
      <div class="field"><label>休憩：補助種目（秒）</label><input class="inp" id="stRestA" inputmode="numeric" value="${s.restAcc}"></div>
    </div>
    <button class="btn primary block" id="stSave">保存</button>
    <div class="sep"></div>
    <div class="card-title">バックアップ <span class="tiny dim">記録 ${days}日分</span></div>
    <p class="small muted" style="margin-bottom:10px">データはこの端末の中だけに保存されています。トレーニング終了時に1タップで外部に保存できます。前回の外部バックアップ：<b style="color:var(--text)">${s.lastBackup ? fmtD(dk(new Date(s.lastBackup))) : 'まだありません'}</b></p>
    <div style="display:grid;gap:8px">
      <button class="btn primary block" id="bkShare">今すぐバックアップ（1タップ）</button>
      <button class="btn block" id="bkExport">バックアップをファイルに保存</button>
      <button class="btn block" id="bkCopy">バックアップをコピー（メモ等に貼り付け用）</button>
      <button class="btn block" id="bkImport">バックアップから復元</button>
    </div>
    <div class="sep"></div>
    <div class="card-title">アプリ内の自動控え <span class="tiny dim">直近3回・間違って消した時用</span></div>
    ${load(KEY_SNAP, []).slice().reverse().map((sn, i, arr) => `<div class="item"><div class="item-main"><div class="item-title">${fmtD(dk(new Date(sn.at)))} ${new Date(sn.at).toTimeString().slice(0, 5)}</div><div class="item-sub">${esc(sn.reason)}</div></div><button class="btn sm" data-snap="${arr.length - 1 - i}">この時点に戻す</button></div>`).join('') || '<div class="small muted">まだありません（トレーニング終了時に自動で作られます）</div>'}
    <div class="tiny dim" style="margin-top:6px">※控えはこの端末の中にあるため、ブラウザのデータ削除や機種変更では消えます。外部バックアップも併用してください。</div>`);
  body.addEventListener('click', async e => {
    if (e.target.closest('#stSave')) {
      const bar = num($('#stBar').value), rm = num($('#stRestM').value), ra = num($('#stRestA').value);
      setSettings({ bar: bar || 20, step: Number($('#stStep').value) || 2.5, restMain: Math.max(15, rm || 180), restAcc: Math.max(15, ra || 90) });
      closeSheet(); toast('保存しました'); if (renderers[currentView]) renderers[currentView](); return;
    }
    if (e.target.closest('#bkShare')) { await shareBackup(); openSettings(); return; }
    const sn = e.target.closest('[data-snap]');
    if (sn) {
      const snap = load(KEY_SNAP, [])[+sn.dataset.snap]; if (!snap) return;
      if (!(await confirmDlg(`${fmtD(dk(new Date(snap.at)))} ${new Date(snap.at).toTimeString().slice(0, 5)} の状態に戻しますか？\n今のデータは上書きされます。`, '戻す', true))) return;
      takeSnapshot('復元前');
      const obj = JSON.parse(snap.json); BACKUP_KEYS.forEach(k => { if (obj.data[k] != null) localStorage.setItem(k, obj.data[k]); else localStorage.removeItem(k); });
      closeSheet(); show(currentView); toast('戻しました'); return;
    }
    if (e.target.closest('#bkExport')) {
      const blob = new Blob([backupJson()], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `forge-bench-backup-${today()}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      setSettings({ lastBackup: Date.now() }); toast('バックアップを保存しました'); return;
    }
    if (e.target.closest('#bkCopy')) {
      try { await navigator.clipboard.writeText(backupJson()); setSettings({ lastBackup: Date.now() }); toast('コピーしました'); }
      catch (err) { const b2 = openSheet('バックアップ（全選択してコピー）', `<textarea class="inp" style="height:60vh;padding:10px;font-size:11px" readonly>${esc(backupJson())}</textarea>`); $('textarea', b2).select(); }
      return;
    }
    if (e.target.closest('#bkImport')) { $('#importFile').value = ''; $('#importFile').click(); }
  });
}
// ---- 自動の控え（アプリ内・直近3回）と、1タップ外部バックアップ ----
const KEY_SNAP = 'forge-bench-snapshots-v1';
function takeSnapshot(reason) {
  try {
    const json = backupJson();
    if (json.length > 1500000) return;
    let arr = load(KEY_SNAP, []);
    const strip = j => j.replace(/"exportedAt":"[^"]*",/, '');
    if (arr.length && strip(arr[arr.length - 1].json) === strip(json)) return;
    arr.push({ at: Date.now(), reason: reason || '', json });
    arr = arr.slice(-3);
    try { localStorage.setItem(KEY_SNAP, JSON.stringify(arr)); }
    catch (e) { localStorage.setItem(KEY_SNAP, JSON.stringify(arr.slice(-1))); }
  } catch (e) {}
}
async function shareBackup() {
  const json = backupJson();
  const name = `forge-bench-backup-${today()}`;
  const markDone = () => { setSettings({ lastBackup: Date.now() }); takeSnapshot('外部バックアップ'); };
  // 共有メニュー（iCloud Drive・Googleドライブ・ファイル・LINE等）→ 使えなければダウンロード
  const candidates = [new File([json], name + '.json', { type: 'application/json' }), new File([json], name + '.txt', { type: 'text/plain' })];
  const file = navigator.canShare ? candidates.find(f => { try { return navigator.canShare({ files: [f] }); } catch (e) { return false; } }) : null;
  if (file && navigator.share) {
    try { await navigator.share({ files: [file], title: 'FORGE バックアップ', text: 'FORGE Bench のバックアップ（' + today() + '）' }); markDone(); toast('バックアップを保存しました'); return true; }
    catch (e) { if (e && e.name === 'AbortError') { toast('バックアップはキャンセルされました', true); return false; } }
  }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  markDone(); toast('バックアップファイルを保存しました'); return true;
}
function daySummary(k) {
  const day = getDay(k);
  let sets = 0, vol = 0, best = null;
  day.exercises.forEach(ex => { const ws = workSets(ex); sets += ws.length; ws.forEach(s => { vol += s.weight * s.reps; }); if (isCompBench(ex.name)) { const b = bestE1rm(ex); if (b && (!best || b > best)) best = b; } });
  return { exercises: day.exercises.length, sets, vol, best, undone: day.exercises.reduce((n, ex) => n + ex.sets.filter(s => !s.done).length, 0) };
}
function finishWorkout(k) {
  const sm = daySummary(k);
  takeSnapshot('トレーニング終了');
  stopRest();
  const last = getSettings().lastBackup;
  const body = openSheet('お疲れさまでした 💪', `
    <div class="grid3" style="margin-bottom:12px">
      <div class="stat"><span>種目</span><b>${sm.exercises}</b></div>
      <div class="stat"><span>本番セット</span><b>${sm.sets}</b></div>
      <div class="stat"><span>総挙上量</span><b>${Math.round(sm.vol).toLocaleString()}<small class="tiny muted">kg</small></b></div>
    </div>
    ${sm.best ? `<div class="card" style="padding:12px;margin-bottom:12px"><div class="tiny muted">今日のベンチ推定1RM</div><div class="big" style="font-size:30px;color:var(--accent2)">${fmtKg(Math.round(sm.best * 10) / 10)}<small>kg</small></div></div>` : ''}
    ${sm.undone ? `<div class="small" style="color:var(--warn);margin-bottom:10px">未完了のセットが${sm.undone}つあります（そのままでも大丈夫です）</div>` : ''}
    <button class="btn primary block" id="fnBackup" style="min-height:52px;font-size:16px">バックアップを保存（1タップ）</button>
    <div class="tiny dim" style="margin:8px 2px 12px">共有メニューが開くので「ファイルに保存」「iCloud Drive」「Googleドライブ」などを選んでください。前回の外部バックアップ：${last ? fmtD(dk(new Date(last))) : 'まだありません'}</div>
    <button class="btn block" id="fnSkip">今回はしない</button>`);
  body.addEventListener('click', async e => {
    if (e.target.closest('#fnBackup')) { const ok = await shareBackup(); if (ok) closeSheet(); if (currentView === 'home') renderHome(); return; }
    if (e.target.closest('#fnSkip')) { closeSheet(); toast('アプリ内に控えを保存しました'); }
  });
}
function backupJson() { const data = {}; BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) data[k] = v; }); return JSON.stringify({ app: 'forge-bench', version: 1, exportedAt: new Date().toISOString(), data }); }
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (!obj || obj.app !== 'forge-bench' || !obj.data) throw new Error('bad');
    const n = obj.data[KEY_DATA] ? Object.keys(JSON.parse(obj.data[KEY_DATA])).length : 0;
    if (!(await confirmDlg(`${(obj.exportedAt || '').slice(0, 10)} のバックアップ（記録${n}日分）で、今のデータを置き換えますか？`, '復元する', true))) return;
    BACKUP_KEYS.forEach(k => { if (obj.data[k] != null) localStorage.setItem(k, obj.data[k]); });
    closeSheet(); show(currentView); toast('復元しました');
  } catch (err) { toast('このファイルは読み込めません', true); }
});
$('#openSettings').addEventListener('click', openSettings);

// ===================== 起動 =====================
renderers.home = renderHome; renderers.log = renderLog; renderers.prog = renderProg; renderers.stats = renderStats;
show('home');
runRest();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
window.__forge = { buildRestWav, startRest, stopRest, getDay, setDay, getTemplates, nextSession, loadTemplateInto, e1rm, platesFor, recentE1rm, weekStats, show, getSettings, setSettings, createProgram };
})();
